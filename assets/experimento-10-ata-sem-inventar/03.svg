<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061b34"/><stop offset="1" stop-color="#0c3850"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bg)"/><circle cx="930" cy="150" r="230" fill="#14b8c7" opacity=".12"/><rect x="80" y="85" rx="24" width="260" height="60" fill="#16bac9"/><text x="110" y="126" font-size="30" font-family="sans-serif" font-weight="700" fill="#062035">NEXO • DEPOIS</text><text x="80" y="300" font-size="71" font-family="sans-serif" font-weight="800" fill="#fff">Um pedido que</text><text x="80" y="388" font-size="71" font-family="sans-serif" font-weight="800" fill="#fff">respeita os fatos</text><rect x="80" y="460" width="920" height="540" rx="36" fill="#f3f8fc"/><text x="135" y="570" font-size="42" font-family="sans-serif" fill="#193449">“Extraia ações das notas.</text><text x="135" y="652" font-size="42" font-family="sans-serif" fill="#193449">Não invente responsáveis ou datas.</text><text x="135" y="734" font-size="42" font-family="sans-serif" fill="#193449">Use ‘não informado’ onde faltar.</text><text x="135" y="816" font-size="42" font-family="sans-serif" fill="#193449">Separe dúvidas a confirmar.”</text><text x="80" y="1100" font-size="34" font-family="sans-serif" font-weight="700" fill="#ffad72">A saída fica mais segura para revisar.</text><text x="80" y="1220" font-size="32" font-family="sans-serif" fill="#c7e5ed">NEXO · IA aplicada, sem mágica</text><text x="900" y="1220" font-size="32" font-family="sans-serif" fill="#c7e5ed">03/04</text></svg>