name: Generate Nexo carousel assets
on:
  push:
    paths:
      - 'media/generate_test_01.py'
      - '.github/workflows/nexo-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: pip install pillow==11.3.0
      - name: Render original artwork
        run: python media/generate_test_01.py
      - name: Commit images
        run: |
          git config user.name 'nexo-media-bot'
          git config user.email 'nexo-media-bot@users.noreply.github.com'
          git add assets/\*.jpg assets/ || true
          git diff --cached --quiet || (git commit -m 'Render Nexo original carousel images' && git push)
