name: Generate Nexo carousel assets
on:
  push:
    paths:
      - 'media/generate_test_*.py'
      - 'media/generate_guide_*.py'
      - '.github/workflows/nexo-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: pip install pillow==11.3.0
      - name: Render original artwork
        run: |
          python media/generate_test_01.py
          python media/generate_test_02.py
          python media/generate_guide_03.py
          python media/generate_experiment_04.py
      - name: Render vertical Reel video
        run: |
          ffmpeg -y -framerate 1/5 -i assets/reel-01-prompt-claro/%02d.jpg -vf 'scale=1080:1920,format=yuv420p' -r 30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart assets/reel-01-prompt-claro/reel.mp4
      - name: Commit images
        run: |
          git config user.name 'nexo-media-bot'
          git config user.email 'nexo-media-bot@users.noreply.github.com'
          git add assets/
          git diff --cached --quiet || (git commit -m 'Render original Nexo carousel images' && git push)
